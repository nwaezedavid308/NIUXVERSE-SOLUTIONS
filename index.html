<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // 1. Theme initialization to prevent flash of unstyled content (FOUC)
        try {
          var savedTheme = localStorage.getItem('niuxverse_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}

        // 2. Intercept and prevent uncaught TypeError if an external/injected script assigns to fetch
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('only a getter') !== -1) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>The Niuxverse - Community of Changemakers, Thinkers &amp; Builders</title>
    <meta name="description" content="A community of changemakers, thinkers, and builders who leverage the power of technology to solve problems and impact lives." />
    <meta property="og:title" content="The Niuxverse - Community of Changemakers, Thinkers &amp; Builders" />
    <meta property="og:description" content="A community of changemakers, thinkers, and builders who leverage the power of technology to solve problems and impact lives." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>

</html>
