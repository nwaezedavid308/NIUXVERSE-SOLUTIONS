<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#02102e; font-family:'Be Vietnam Pro', -apple-system, sans-serif;">
  <defs>
    <radialGradient id="blueGlow" cx="15%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#0065E1" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0065E1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#02102e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#01CF11" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#01CF11" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#02102e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerCore" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#0065E1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#02102e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061e4a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#02102e" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2eeff"/>
      <stop offset="100%" stop-color="#c2ddff"/>
    </linearGradient>
    <linearGradient id="borderLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0065E1"/>
      <stop offset="50%" stop-color="#01CF11"/>
      <stop offset="100%" stop-color="#0065E1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0065E1" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base & Glows -->
  <rect width="1200" height="800" fill="#02102e"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#blueGlow)"/>
  <rect width="1200" height="800" fill="url(#greenGlow)"/>
  <rect width="1200" height="800" fill="url(#centerCore)"/>

  <!-- Outer Neon Border Framing -->
  <rect x="24" y="24" width="1152" height="752" rx="24" fill="none" stroke="#0065E1" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="32" y="32" width="1136" height="736" rx="18" fill="none" stroke="#01CF11" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Corner Brackets -->
  <path d="M 24 64 L 24 24 L 64 24" fill="none" stroke="#01CF11" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 1176 64 L 1176 24 L 1136 24" fill="none" stroke="#0065E1" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 24 736 L 24 776 L 64 776" fill="none" stroke="#0065E1" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 1176 736 L 1176 776 L 1136 776" fill="none" stroke="#01CF11" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Header Badges -->
  <g transform="translate(64, 56)">
    <rect x="0" y="0" width="320" height="40" rx="20" fill="#0065E1" fill-opacity="0.2" stroke="#0065E1" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="22" cy="20" r="6" fill="#01CF11"/>
    <text x="38" y="25" font-size="12" font-weight="800" fill="#01CF11" letter-spacing="2">NIUXVERSE LIVE DIALOGUE</text>
    <text x="240" y="25" font-size="11" font-weight="600" fill="#94a3b8">/ EPISODE 01</text>
  </g>

  <g transform="translate(840, 56)">
    <rect x="0" y="0" width="296" height="40" rx="20" fill="#01CF11" fill-opacity="0.15" stroke="#01CF11" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="22" cy="20" r="5" fill="#01CF11"/>
    <text x="38" y="25" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1.2">SUNDAY, 4TH OCTOBER 2026</text>
  </g>

  <!-- Main Hero Title Section (Left) -->
  <g transform="translate(64, 150)">
    <text x="0" y="24" font-size="14" font-weight="800" fill="#0065E1" letter-spacing="3.5">
      FLAGSHIP IMPACT TALK &amp; MASTERCLASS
    </text>

    <!-- Large Title -->
    <text x="0" y="96" font-size="68" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
      WHAT MAKES US
    </text>
    <text x="0" y="172" font-size="74" font-weight="900" fill="#01CF11" letter-spacing="1">
      HUMAN?
    </text>

    <!-- Glowing Accent Divider -->
    <rect x="0" y="196" width="240" height="4" rx="2" fill="url(#borderLine)"/>

    <!-- Key Questions & Premise -->
    <text x="0" y="242" font-size="22" font-weight="600" fill="#ffffff" letter-spacing="0.2">
      In a world of fast-moving technology,
    </text>
    <text x="0" y="274" font-size="22" font-weight="700" fill="#01CF11" letter-spacing="0.2">
      what truly sets human beings apart?
    </text>

    <text x="0" y="320" font-size="15" font-weight="400" fill="#94a3b8">
      Consciousness, empathy, creative sovereignty, and the moral boundaries
    </text>
    <text x="0" y="344" font-size="15" font-weight="400" fill="#94a3b8">
      that define human purpose in an age of automated intelligence.
    </text>
  </g>

  <!-- Right Side Cyber-Human Neural Art Composition -->
  <g transform="translate(740, 140)">
    <!-- Orbital Rings -->
    <circle cx="210" cy="200" r="190" fill="none" stroke="#0065E1" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="210" cy="200" r="150" fill="none" stroke="#01CF11" stroke-opacity="0.25" stroke-width="1.8" stroke-dasharray="14 8"/>
    <circle cx="210" cy="200" r="110" fill="none" stroke="#0065E1" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="210" cy="200" r="75" fill="#0065E1" fill-opacity="0.12" stroke="#01CF11" stroke-opacity="0.5" stroke-width="2"/>

    <!-- Inner Core Spark of Humanity -->
    <circle cx="210" cy="200" r="16" fill="#01CF11" fill-opacity="0.9"/>
    <circle cx="210" cy="200" r="8" fill="#ffffff"/>

    <!-- Interconnected Neural Constellation -->
    <path d="M 210 50 L 300 120 L 340 210 L 290 310 L 170 330 L 90 250 L 110 130 Z" fill="none" stroke="#0065E1" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M 210 200 L 210 50 M 210 200 L 300 120 M 210 200 L 340 210 M 210 200 L 290 310 M 210 200 L 170 330 M 210 200 L 90 250 M 210 200 L 110 130" stroke="#01CF11" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Node Points -->
    <circle cx="210" cy="50" r="6" fill="#0065E1" stroke="#ffffff" stroke-width="2"/>
    <circle cx="300" cy="120" r="6" fill="#01CF11" stroke="#ffffff" stroke-width="2"/>
    <circle cx="340" cy="210" r="6" fill="#0065E1" stroke="#ffffff" stroke-width="2"/>
    <circle cx="290" cy="310" r="6" fill="#01CF11" stroke="#ffffff" stroke-width="2"/>
    <circle cx="170" cy="330" r="6" fill="#0065E1" stroke="#ffffff" stroke-width="2"/>
    <circle cx="90" cy="250" r="6" fill="#01CF11" stroke="#ffffff" stroke-width="2"/>
    <circle cx="110" cy="130" r="6" fill="#0065E1" stroke="#ffffff" stroke-width="2"/>

    <!-- Human Head Silhouette Path -->
    <path d="M 140 80 C 200 60 260 90 280 140 C 295 175 285 200 300 220 C 310 230 320 235 315 250 C 305 260 280 255 275 270 C 265 290 275 310 255 330 C 235 350 190 365 150 350" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3.5"/>
  </g>

  <!-- Lower Speaker Cards -->
  <!-- Speaker 1: Mr Ifeanyi Nwakpoke -->
  <g transform="translate(64, 544)">
    <rect x="0" y="0" width="326" height="164" rx="18" fill="url(#cardBg)" stroke="#0065E1" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="18" y="18" width="44" height="44" rx="22" fill="#0065E1" fill-opacity="0.25" stroke="#0065E1" stroke-width="1.8"/>
    <text x="40" y="45" font-size="14" font-weight="800" fill="#0065E1" text-anchor="middle">IN</text>
    <text x="74" y="32" font-size="10" font-weight="800" fill="#01CF11" letter-spacing="1.5">FEATURED SPEAKER</text>
    <text x="74" y="54" font-size="17" font-weight="800" fill="#ffffff">Mr Ifeanyi Nwakpoke</text>
    <text x="20" y="96" font-size="13" font-weight="700" fill="#01CF11">Writer &amp; Thinker</text>
    <text x="20" y="120" font-size="12" font-weight="400" fill="#cbd5e1">Examining human lived experiences, emotional</text>
    <text x="20" y="138" font-size="12" font-weight="400" fill="#cbd5e1">depth, and authentic creative expression.</text>
  </g>

  <!-- Speaker 2: Blessing Egbe -->
  <g transform="translate(422, 544)">
    <rect x="0" y="0" width="346" height="164" rx="18" fill="url(#cardBg)" stroke="#0065E1" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="18" y="18" width="44" height="44" rx="22" fill="#01CF11" fill-opacity="0.2" stroke="#01CF11" stroke-width="1.8"/>
    <text x="40" y="45" font-size="14" font-weight="800" fill="#01CF11" text-anchor="middle">BE</text>
    <text x="74" y="32" font-size="10" font-weight="800" fill="#01CF11" letter-spacing="1.5">FEATURED SPEAKER</text>
    <text x="74" y="54" font-size="17" font-weight="800" fill="#ffffff">Blessing Egbe</text>
    <text x="20" y="96" font-size="13" font-weight="700" fill="#0065E1">AI Ethics &amp; Governance Expert</text>
    <text x="20" y="120" font-size="12" font-weight="400" fill="#cbd5e1">Frameworks on ethical guardrails, algorithmic</text>
    <text x="20" y="138" font-size="12" font-weight="400" fill="#cbd5e1">accountability, and protecting human dignity.</text>
  </g>

  <!-- Moderator: King of Intelligence -->
  <g transform="translate(800, 544)">
    <rect x="0" y="0" width="336" height="164" rx="18" fill="url(#cardBg)" stroke="#01CF11" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="18" y="18" width="44" height="44" rx="22" fill="#0065E1" fill-opacity="0.3" stroke="#01CF11" stroke-width="1.8"/>
    <text x="40" y="45" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">KOI</text>
    <text x="74" y="32" font-size="10" font-weight="800" fill="#0065E1" letter-spacing="1.5">MODERATOR &amp; HOST</text>
    <text x="74" y="54" font-size="17" font-weight="800" fill="#ffffff">King of Intelligence</text>
    <text x="20" y="96" font-size="13" font-weight="700" fill="#01CF11">Nwaeze David</text>
    <text x="20" y="120" font-size="12" font-weight="400" fill="#cbd5e1">Founder, The Niuxverse</text>
    <text x="20" y="138" font-size="12" font-weight="400" fill="#cbd5e1">Fostering high-impact critical thinking.</text>
  </g>

  <!-- Bottom Brand Signature -->
  <g transform="translate(64, 745)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">
      THE NIUXVERSE • CHANGEMAKERS • THINKERS • BUILDERS
    </text>
  </g>
</svg>